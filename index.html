<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #000000;
            overflow: hidden;
            font-family: "Orbitron", "Poppins", sans-serif;
        }

        .loader-gif {
            width: 700px;
            max-width: 90vw;
            height: auto;
            margin-bottom: 20px;
            object-fit: contain;
        }

        /* ===== TEXT ANIMATION ===== */
        .loading-text {
            font-size: 36px;
            font-weight: 700;
            color: #00d9ff;
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: textGlow 2.5s infinite ease-in-out;
            text-shadow:
                0 0 10px #00d9ff,
                0 0 20px #00d9ff,
                0 0 30px rgba(0, 217, 255, 0.5);
            position: relative;
        }

        .loading-text::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d9ff, transparent);
            box-shadow: 0 0 10px #00d9ff;
        }

        @keyframes textGlow {

            0%,
            100% {
                opacity: 0.7;
                text-shadow: 0 0 10px #00d9ff, 0 0 20px #00d9ff;
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 20px #00d9ff, 0 0 40px #00d9ff, 0 0 60px rgba(0, 217, 255, 0.5);
            }
        }

        .subtitle {
            font-size: 12px;
            color: #ff6b35;
            letter-spacing: 3px;
            margin-top: 20px;
            opacity: 0.8;
            text-transform: uppercase;
            animation: subtitleBlink 3s infinite;
        }

        @keyframes subtitleBlink {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        /* Fade-out effect */
        .fade-out {
            animation: fade 0.7s forwards;
        }

        @keyframes fade {
            to {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <img src="animation/goble_animation.gif" alt="Loading..." class="loader-gif">

    <div class="loading-text">Kalana's Portfolio</div>
    <div class="subtitle">INITIALIZING SYSTEM</div>

    <script>
        // Wait for the window (including images) to fully load
        window.addEventListener('load', () => {
            // Keep the animation playing for at least 4.5 seconds after load
            setTimeout(() => {
                document.body.classList.add("fade-out");

                setTimeout(() => {
                    window.location.href = "Home.html";
                }, 700);

            }, 4500);
        });
    </script>

</body>

</html>
