<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #1E0C04; /* dark coffee */
            overflow: hidden;
            font-family: "Poppins", sans-serif;
        }

        /* ===== LOADER ===== */
        .loader {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 35px;
        }

        .orb {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #E0D8D6; /* light cream */
            transform: translate(-50%, -50%);
            animation: pulse 1.3s infinite ease-in-out;
            box-shadow: 0 0 20px #E0D8D6, 0 0 40px #E0D8D6;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(2.6); opacity: 0.25; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .ring {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top: 4px solid #4C2A19;  /* deep brown */
            border-bottom: 4px solid #775646; /* soft brown */
            animation: spin 1.5s linear infinite;
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: 0 0 25px #775646;
        }

        @keyframes spin {
            0% { transform: rotate(0); }
            100% { transform: rotate(360deg); }
        }

        /* ===== TEXT ANIMATION ===== */
        .loading-text {
            font-size: 28px;
            font-weight: 600;
            color: #E0D8D6;
            letter-spacing: 2px;
            animation: fadeText 1.8s infinite ease-in-out;
        }

        @keyframes fadeText {
            0% { opacity: 0.1; }
            50% { opacity: 1; }
            100% { opacity: 0.1; }
        }

        /* Fade-out effect */
        .fade-out {
            animation: fade 0.7s forwards;
        }

        @keyframes fade {
            to { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="loader">
        <div class="ring"></div>
        <div class="orb"></div>
    </div>

    <div class="loading-text">Kalana's Portfolio</div>

    <script>
        // Redirect after animation
        setTimeout(() => {
            document.body.classList.add("fade-out");

            setTimeout(() => {
                window.location.href = "Home.html";
            }, 700);

        }, 3200);
    </script>

</body>
</html>
