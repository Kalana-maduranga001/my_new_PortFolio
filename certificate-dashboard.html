<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Certificate Stage — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#071025;
    --panel:#071827;
    --accent:#38bdf8;
    --muted:#9aa9b8;
    --glass: rgba(255,255,255,0.03);
    --ring: rgba(56,189,248,0.18);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Poppins', 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: linear-gradient(180deg,var(--bg),#041022 140%);
    color:#e6eef6;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow:hidden;
  }

  /* Keyframe Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 0 20px rgba(56,189,248,0.3); }
    50% { box-shadow: 0 0 40px rgba(56,189,248,0.6); }
  }

  @keyframes shimmer {
    0% { background-position: -1000px 0; }
    100% { background-position: 1000px 0; }
  }

  /* layout */
  .app{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:18px;
    height:100vh;
    padding:18px;
    animation: fadeIn 0.6s ease-out;
    overflow:hidden;
  }

  /* left panel */
  .panel{
    background: linear-gradient(180deg,var(--panel), #02111b);
    border-radius:12px;
    padding:14px;
    box-shadow: 0 6px 30px rgba(2,6,23,0.6);
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.03);
    animation: slideInLeft 0.6s ease-out;
  }

  .panel h2{
    font-size:20px;
    margin:0;
    color:var(--accent);
    text-align:center;
    letter-spacing:0.5px;
    font-weight:600;
    font-family:'Poppins', sans-serif;
    animation: fadeIn 0.8s ease-out 0.2s both;
    text-shadow: 0 0 20px rgba(56,189,248,0.3);
  }

  .controls{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }

  .search{
    flex:1;
    min-width:140px;
    display:flex;
    align-items:center;
    gap:8px;
    background: rgba(255,255,255,0.02);
    padding:6px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.02);
  }

  .search input{
    background:transparent;
    border:none;
    outline:none;
    color:#e6eef6;
    width:100%;
    font-size:13px;
  }

  .search input::placeholder{
    color:var(--muted);
  }

  /* thumbs area */
  .thumbs{
    overflow-y:auto;
    overflow-x:hidden;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }

  .thumbs::-webkit-scrollbar{
    width:6px;
  }

  .thumbs::-webkit-scrollbar-track{
    background:rgba(255,255,255,0.02);
    border-radius:3px;
  }

  .thumbs::-webkit-scrollbar-thumb{
    background:rgba(56,189,248,0.3);
    border-radius:3px;
  }

  .thumb-row{
    display:flex;
    gap:10px;
    align-items:center;
    padding:8px;
    border-radius:8px;
    cursor:pointer;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border:1px solid transparent;
    animation: slideInLeft 0.4s ease-out backwards;
    animation-delay: calc(var(--index) * 0.05s);
  }

  .thumb-row:hover{
    background:rgba(255,255,255,0.03);
    border-color:rgba(56,189,248,0.2);
    transform: translateX(5px);
  }

  .thumb-row.active{
    background:rgba(56,189,248,0.08);
    border-color:var(--accent);
    animation: glow 2s ease-in-out infinite;
  }

  .thumb{
    width:80px;
    height:56px;
    border-radius:6px;
    object-fit:cover;
    box-shadow: 0 4px 14px rgba(2,6,23,0.7);
    border:2px solid transparent;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink:0;
  }

  .thumb-row:hover .thumb{
    transform:scale(1.08) rotate(2deg);
    box-shadow: 0 8px 20px rgba(56,189,248,0.3);
  }

  .thumb-row.active .thumb{
    border-color:var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  .meta{
    font-size:12px;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow:hidden;
    flex:1;
  }

  .meta .name{
    font-weight:600;
    color:#dff7ff;
    white-space:nowrap;
    text-overflow:ellipsis;
    overflow:hidden;
    font-size:13px;
    font-family:'Inter', sans-serif;
    letter-spacing:0.3px;
  }

  .meta .type{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    font-weight:500;
    letter-spacing:0.5px;
  }

  /* main stage */
  .stage-wrap{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:10px;
    animation: slideInRight 0.6s ease-out;
    overflow-y:auto;
    overflow-x:hidden;
    max-height:100%;
  }

  .stage-wrap::-webkit-scrollbar{
    width:8px;
  }

  .stage-wrap::-webkit-scrollbar-track{
    background:rgba(255,255,255,0.02);
    border-radius:4px;
  }

  .stage-wrap::-webkit-scrollbar-thumb{
    background:rgba(56,189,248,0.3);
    border-radius:4px;
  }

  .stage-wrap::-webkit-scrollbar-thumb:hover{
    background:rgba(56,189,248,0.5);
  }

  .stage{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    overflow:hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.03);
    box-shadow: 0 10px 60px rgba(2,6,23,0.6);
    min-height:400px;
    animation: scaleIn 0.6s ease-out 0.2s both;
  }

  /* glowing ring effect */
  .stage::before{
    content:"";
    position:absolute;
    inset: -30px;
    border-radius:20px;
    pointer-events:none;
    background: radial-gradient(closest-side, var(--ring), transparent 60%);
    filter: blur(18px);
    opacity:0.9;
    transition:opacity .5s ease;
    animation: pulse 3s ease-in-out infinite;
  }

  .stage.has-image::before{
    opacity:1;
  }

  .stage-inner{
    position:relative;
    width:92%;
    height:92%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage img{
    max-width:100%;
    max-height:100%;
    border-radius:10px;
    box-shadow: 0 12px 80px rgba(2,6,23,0.6);
    transform-origin:center center;
    transition: transform .4s cubic-bezier(0.4, 0, 0.2, 1), filter .25s ease;
    background:linear-gradient(180deg,#0c2331,#06121a);
    object-fit:contain;
    user-select:none;
    animation: scaleIn 0.5s ease-out;
  }

  .stage img:hover{
    filter: brightness(1.05);
  }

  .stage .placeholder{
    color:var(--muted);
    font-size:18px;
    text-align:center;
    padding:40px;
  }

  /* controls below stage */
  .stage-controls{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
  }

  .left-controls{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }

  .small{
    background:transparent;
    color:var(--muted);
    border:1px solid rgba(255,255,255,0.03);
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-family:'Inter', sans-serif;
    font-weight:500;
  }

  .small:hover{
    background:rgba(255,255,255,0.03);
    color:var(--accent);
    border-color:rgba(56,189,248,0.3);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(56,189,248,0.2);
  }

  .small:active{
    transform: translateY(0);
  }

  .progress{
    display:flex;
    gap:8px;
    align-items:center;
  }

  .range{
    width:160px;
  }

  .thumb-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
    gap:10px;
    padding:10px;
    max-height:200px;
    overflow:auto;
    margin-top:6px;
    background:rgba(255,255,255,0.01);
    border-radius:8px;
  }

  .thumb-grid::-webkit-scrollbar{
    height:6px;
  }

  .thumb-grid::-webkit-scrollbar-track{
    background:rgba(255,255,255,0.02);
  }

  .thumb-grid::-webkit-scrollbar-thumb{
    background:rgba(56,189,248,0.3);
    border-radius:3px;
  }

  .grid-item{
    background: rgba(255,255,255,0.02);
    border-radius:8px;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:2px solid transparent;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    animation: scaleIn 0.4s ease-out backwards;
    animation-delay: calc(var(--grid-index) * 0.03s);
  }

  .grid-item:hover{
    background:rgba(255,255,255,0.04);
    border-color:rgba(56,189,248,0.3);
    transform:translateY(-4px) scale(1.02);
    box-shadow: 0 8px 20px rgba(56,189,248,0.2);
  }

  .grid-item.active{
    border-color:var(--accent);
    background:rgba(56,189,248,0.08);
    animation: glow 2s ease-in-out infinite;
  }

  .grid-item img{
    width:100%;
    height:80px;
    object-fit:cover;
    border-radius:6px;
  }

  .grid-item .caption{
    font-size:11px;
    color:var(--muted);
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%;
  }

  /* file counter */
  .file-counter{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    padding:8px;
    background:rgba(255,255,255,0.02);
    border-radius:6px;
    margin-top:4px;
  }

  .btn{
    background:var(--glass);
    border:1px solid rgba(255,255,255,0.04);
    color:var(--accent);
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    display:inline-flex;
    gap:6px;
    align-items:center;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-family:'Inter', sans-serif;
    font-weight:500;
  }

  .btn:hover{
    background:rgba(56,189,248,0.1);
    border-color:var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(56,189,248,0.3);
  }

  .btn:active{
    transform: translateY(0);
  }

  /* responsive */
  @media (max-width:900px){
    .app{ 
      grid-template-columns: 1fr; 
      grid-template-rows: 1fr auto;
      padding:12px; 
      gap:12px;
      overflow-y:auto;
      height:auto;
      min-height:100vh;
    }
    .panel{ 
      order:2; 
      max-height:280px;
    }
    .stage-wrap{ 
      order:1; 
      min-height:auto;
      max-height:none;
      overflow:visible;
    }
    .stage{
      min-height:300px;
    }
    .thumb-grid{
      max-height:120px;
    }
    .stage-controls{
      flex-direction:column;
      align-items:stretch;
    }
    .left-controls{
      flex-wrap:wrap;
      justify-content:center;
    }
  }

  @media (max-width:600px){
    .app{
      padding:8px;
      gap:8px;
    }
    .panel{
      max-height:240px;
      padding:10px;
    }
    .panel h2{
      font-size:16px;
    }
    .thumb-row{
      padding:6px;
    }
    .thumb{
      width:60px;
      height:42px;
    }
    .meta .name{
      font-size:11px;
    }
    .meta .type{
      font-size:10px;
    }
    .stage{
      min-height:250px;
    }
    .small, .btn{
      padding:6px 10px;
      font-size:12px;
    }
    .range{
      width:100px;
    }
    .thumb-grid{
      grid-template-columns: repeat(auto-fill,minmax(80px,1fr));
      max-height:100px;
      gap:6px;
    }
    .grid-item img{
      height:60px;
    }
    #fileName{
      font-size:12px;
    }
    #fileInfo{
      font-size:10px;
    }
  }
</style>
</head>
<body>

<div class="app">

  <!-- LEFT PANEL -->
  <aside class="panel" aria-label="Certificates panel">
    <h2>📜 My Certificates</h2>

    <div class="controls" role="toolbar" aria-label="toolbar">
      <div class="search" title="Search certificates">
        🔎
        <input id="search" type="search" placeholder="Search..." aria-label="search certificates">
      </div>
    </div>

    <div class="file-counter" id="fileCounter">
      Loading certificates...
    </div>

    <div class="thumbs" id="thumbs" aria-live="polite" aria-atomic="false">
    </div>

    <div style="display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap;">
      <button id="toggleGrid" class="small" title="Toggle thumbnail grid">Grid View</button>
      <button id="slideshowToggle" class="small" title="Start/stop slideshow">▶ Slideshow</button>
    </div>

  </aside>

  <!-- MAIN STAGE -->
  <main class="stage-wrap">
    <div class="stage" id="stage" aria-label="certificate stage">
      <div class="stage-inner">
        <div class="placeholder">
          <div style="font-size:48px; margin-bottom:16px;">📄</div>
          <div>Select a certificate to view</div>
        </div>
        <img id="stageImg" src="" alt="" draggable="false" style="display:none;">
      </div>
    </div>

    <div class="stage-controls">
      <div class="left-controls">
        <button id="prev" class="small" title="Previous (←)">◀ Prev</button>
        <button id="next" class="small" title="Next (→)">Next ▶</button>

        <div class="progress">
          <label style="font-size:12px; color:var(--muted)">Zoom</label>
          <input id="zoom" class="range" type="range" min="0.2" max="2.5" step="0.05" value="1" />
        </div>

        <button id="rotateLeft" class="small" title="Rotate -90°">⟲</button>
        <button id="rotateRight" class="small" title="Rotate +90°">⟳</button>
        <button id="fitBtn" class="small" title="Reset view">↺ Reset</button>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <div style="text-align:right; font-size:13px; color:var(--muted)">
          <div id="fileName" style="color:#dff7ff; font-weight:500;">No file selected</div>
          <div id="fileInfo" style="font-size:11px; color:var(--muted)"></div>
        </div>

        <button id="fullscreen" class="btn" title="Fullscreen">⤢</button>
      </div>
    </div>

    <div class="thumb-grid" id="grid" aria-label="thumbnails grid"></div>

  </main>

</div>

<script>
/*
  Certificate Stage Dashboard
*/

const thumbs = document.getElementById('thumbs');
const grid = document.getElementById('grid');
const stageImg = document.getElementById('stageImg');
const stage = document.getElementById('stage');
const placeholder = document.querySelector('.placeholder');
const fileNameLabel = document.getElementById('fileName');
const fileInfo = document.getElementById('fileInfo');
const fileCounter = document.getElementById('fileCounter');
const search = document.getElementById('search');

let items = []; // { id, name, url, type }
let current = -1;
let rotation = 0;
let zoom = 1;
let slideshowTimer = null;
let gridMode = true;

// Predefined certificate list (images from your folder)
const certificateList = [
  'Advanced Testing Practices Using AWS DevOps Toolsp.png',
  'AWS Cloud Practitioner Essentials Certification.png',
  'AWS Command Line Interface (CLI) Basics.png',
  'AWS Educate Introduction to Cloud 101.png',
  'Cloud Computing Foundation.png',
  'Cloud Essentials Knowledge Badge Assessment.png',
  'CodeRally 6.0 Competitive Programming Hackathon.png',
  'CodeRally5.0 hackathon, hosted by IEEE Computer Society Student Branch Chapter of IIT.png',
  'DevOps Engineer Learning Plan.png',
  'devops foundation.png',
  'DevOps Foundations Incident Management_PMI.png',
  'DevOps Foundations-Continuous Delivery and Continuous Integration.png',
  'Docker Basics for DevOps certification.png',
  'Getting into the Serverless Mindset.png',
  'Getting Started with DevOps on AWS.png',
  'Introduction to Git.png',
  'Introduction to Observability.png',
  'Jenkins.png',
  'KodeKloud Docker course certificate.png',
  'KodeKloud Engineer certificate.png',
  'Meta and Coursera course certificate.png',
  'Microsoft Learn Student Ambassador.png',
  'OCI Certification.png',
  'Shell Scripting Beginners.png',
  'Skill Up 3.0.png',
  'TechXplore 1.0.png'
];

// Helper
function uid() { return Math.random().toString(36).slice(2,9) }

// Update file counter
function updateCounter(){
  const visible = items.filter(it => {
    const row = thumbs.querySelector(`[data-id="${it.id}"]`);
    return row && row.style.display !== 'none';
  }).length;
  
  if(items.length === 0){
    fileCounter.textContent = 'No certificates loaded';
  } else if(visible === items.length){
    fileCounter.textContent = `${items.length} certificate${items.length !== 1 ? 's' : ''}`;
  } else {
    fileCounter.textContent = `${visible} of ${items.length} certificate${items.length !== 1 ? 's' : ''}`;
  }
}

// Load certificates from predefined list
function loadCertificates(){
  certificateList.forEach(filename => {
    const id = uid();
    const item = { 
      id, 
      name: filename, 
      url: './portfolioSetificat/' + filename, 
      type: 'image/png' 
    };
    items.push(item);
    renderThumb(item);
    renderGridItem(item);
  });
  
  updateCounter();
  
  // Auto-select first certificate
  if(items.length > 0) {
    showIndex(0);
  }
}

// Thumb rendering (left panel)
function renderThumb(item){
  const row = document.createElement('div');
  row.className = 'thumb-row';
  row.dataset.id = item.id;
  row.style.setProperty('--index', items.length - 1);

  const img = document.createElement('img');
  img.loading = 'lazy';
  img.className = 'thumb';
  img.src = item.url;
  img.alt = item.name;

  row.addEventListener('click', () => {
    const index = items.findIndex(x=>x.id===item.id);
    showIndex(index);
  });

  const meta = document.createElement('div');
  meta.className = 'meta';
  
  const nm = document.createElement('div');
  nm.className = 'name';
  nm.textContent = item.name;
  nm.title = item.name;
  
  const typeLabel = document.createElement('div');
  typeLabel.className = 'type';
  typeLabel.textContent = 'Certificate';
  
  meta.appendChild(nm);
  meta.appendChild(typeLabel);

  row.appendChild(img);
  row.appendChild(meta);
  thumbs.appendChild(row);
}

// Grid rendering
function renderGridItem(item){
  const box = document.createElement('div');
  box.className = 'grid-item';
  box.dataset.id = item.id;
  box.style.setProperty('--grid-index', items.length - 1);
  
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.src = item.url;
  img.alt = item.name;

  const caption = document.createElement('div');
  caption.className = 'caption';
  caption.textContent = item.name;
  caption.title = item.name;

  box.appendChild(img);
  box.appendChild(caption);
  
  box.addEventListener('click', () => {
    const index = items.findIndex(x=>x.id===item.id);
    showIndex(index);
    scrollThumbIntoView(item.id);
  });

  grid.appendChild(box);
}

// Show item by index
function showIndex(index){
  if(index < 0 || index >= items.length) return;
  current = index;
  const it = items[index];
  
  // Show image, hide placeholder
  placeholder.style.display = 'none';
  stageImg.style.display = 'block';
  stageImg.src = it.url;
  stageImg.style.transform = `scale(${zoom}) rotate(${rotation}deg)`;
  stageImg.alt = it.name;
  stage.classList.add('has-image');
  
  fileNameLabel.textContent = it.name;
  fileInfo.textContent = 'Certificate';
  
  updateActiveThumb();
  updateActiveGrid();
  scrollThumbIntoView(it.id);
  
  // Scroll stage to top when certificate is selected
  const stageWrap = document.querySelector('.stage-wrap');
  if(stageWrap){
    stageWrap.scrollTo({ top: 0, behavior: 'smooth' });
  }
  
  // On mobile, scroll the entire page to show the stage
  if(window.innerWidth <= 900){
    setTimeout(() => {
      stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

// Update active class for thumbs
function updateActiveThumb(){
  document.querySelectorAll('.thumb-row').forEach(t => t.classList.remove('active'));
  const it = items[current];
  if(!it) return;
  const row = thumbs.querySelector(`[data-id="${it.id}"]`);
  if(row) row.classList.add('active');
}

// Update active for grid
function updateActiveGrid(){
  document.querySelectorAll('.grid-item').forEach(g => {
    g.classList.remove('active');
  });
  
  if(current >= 0 && items[current]){
    const id = items[current].id;
    const el = grid.querySelector(`[data-id="${id}"]`);
    if(el) el.classList.add('active');
  }
}

// Scroll thumb into view
function scrollThumbIntoView(id){
  const row = thumbs.querySelector(`[data-id="${id}"]`);
  if(row) row.scrollIntoView({behavior:'smooth', block:'center'});
}

/* Controls */
document.getElementById('next').addEventListener('click', () => {
  if(items.length === 0) return;
  showIndex((current + 1) % items.length);
});

document.getElementById('prev').addEventListener('click', () => {
  if(items.length === 0) return;
  showIndex((current - 1 + items.length) % items.length);
});

document.getElementById('toggleGrid').addEventListener('click', () => {
  gridMode = !gridMode;
  grid.style.display = gridMode ? 'grid' : 'none';
  document.getElementById('toggleGrid').textContent = gridMode ? 'Hide Grid' : 'Grid View';
});

/* Zoom and rotate */
const zoomControl = document.getElementById('zoom');
zoomControl.addEventListener('input', (e) => {
  zoom = parseFloat(e.target.value);
  updateTransform();
});

document.getElementById('rotateLeft').addEventListener('click', () => { 
  rotation -= 90; 
  updateTransform(); 
});

document.getElementById('rotateRight').addEventListener('click', () => { 
  rotation += 90; 
  updateTransform(); 
});

document.getElementById('fitBtn').addEventListener('click', () => { 
  zoom = 1; 
  rotation = 0; 
  zoomControl.value = 1; 
  updateTransform(); 
});

function updateTransform(){
  if(stageImg.style.display !== 'none'){
    stageImg.style.transform = `scale(${zoom}) rotate(${rotation}deg)`;
  }
}

/* Fullscreen */
document.getElementById('fullscreen').addEventListener('click', async () => {
  const s = document.documentElement;
  if(!document.fullscreenElement){
    await s.requestFullscreen?.();
  } else {
    await document.exitFullscreen?.();
  }
});

/* Slideshow */
document.getElementById('slideshowToggle').addEventListener('click', () => toggleSlideshow());

function toggleSlideshow(){
  if(slideshowTimer){
    clearInterval(slideshowTimer);
    slideshowTimer = null;
    document.getElementById('slideshowToggle').textContent = '▶ Slideshow';
  } else {
    if(items.length === 0){
      alert('No certificates to show');
      return;
    }
    slideshowTimer = setInterval(() => {
      if(items.length === 0) return;
      showIndex((current + 1) % items.length);
    }, 3000);
    document.getElementById('slideshowToggle').textContent = '⏸ Stop';
  }
}

/* Keyboard shortcuts */
window.addEventListener('keydown', (e) => {
  if(e.target.tagName === 'INPUT') return;
  
  if(e.key === 'ArrowRight') document.getElementById('next').click();
  if(e.key === 'ArrowLeft') document.getElementById('prev').click();
  if(e.key === '+' || e.key === '=') { 
    zoom = Math.min(2.5, zoom + 0.1); 
    zoomControl.value = zoom; 
    updateTransform(); 
  }
  if(e.key === '-' || e.key === '_') { 
    zoom = Math.max(0.2, zoom - 0.1); 
    zoomControl.value = zoom; 
    updateTransform(); 
  }
  if(e.key === ' ') { 
    e.preventDefault(); 
    toggleSlideshow(); 
  }
  if(e.key === 'f' || e.key === 'F'){
    document.getElementById('fullscreen').click();
  }
  if(e.key === 'r' || e.key === 'R'){
    document.getElementById('fitBtn').click();
  }
}); 

/* Search */
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  
  thumbs.querySelectorAll('.thumb-row').forEach(row => {
    const id = row.dataset.id;
    const it = items.find(x=>x.id===id);
    if(it){
      row.style.display = it.name.toLowerCase().includes(q) ? 'flex' : 'none';
    }
  });
  
  grid.querySelectorAll('.grid-item').forEach(g => {
    const id = g.dataset.id;
    const it = items.find(x=>x.id===id);
    if(it){
      g.style.display = it.name.toLowerCase().includes(q) ? 'flex' : 'none';
    }
  });
  
  updateCounter();
});

// Initialize: Load certificates on page load
window.addEventListener('DOMContentLoaded', () => {
  loadCertificates();
});

</script>
</body>
</html>
