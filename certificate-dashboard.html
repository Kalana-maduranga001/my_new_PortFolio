<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Certificate Stage — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#071025;
    --panel:#071827;
    --accent:#38bdf8;
    --muted:#9aa9b8;
    --glass: rgba(255,255,255,0.03);
    --ring: rgba(56,189,248,0.18);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Poppins', 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: linear-gradient(180deg,var(--bg),#041022 140%);
    color:#e6eef6;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow:hidden;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 0 20px rgba(56,189,248,0.3); }
    50% { box-shadow: 0 0 40px rgba(56,189,248,0.6); }
  }

  .app{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:18px;
    height:100vh;
    padding:18px;
    animation: fadeIn 0.6s ease-out;
    overflow:hidden;
  }

  .panel{
    background: linear-gradient(180deg,var(--panel), #02111b);
    border-radius:12px;
    padding:14px;
    box-shadow: 0 6px 30px rgba(2,6,23,0.6);
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.03);
    animation: slideInLeft 0.6s ease-out;
  }

  .panel h2{
    font-size:20px;
    margin:0;
    color:var(--accent);
    text-align:center;
    letter-spacing:0.5px;
    font-weight:600;
    font-family:'Poppins', sans-serif;
    animation: fadeIn 0.8s ease-out 0.2s both;
    text-shadow: 0 0 20px rgba(56,189,248,0.3);
  }

  .controls{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }

  .search{
    flex:1;
    min-width:140px;
    display:flex;
    align-items:center;
    gap:8px;
    background: rgba(255,255,255,0.02);
    padding:6px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.02);
  }

  .search input{
    background:transparent;
    border:none;
    outline:none;
    color:#e6eef6;
    width:100%;
    font-size:13px;
  }

  .search input::placeholder{
    color:var(--muted);
  }

  .thumbs{
    overflow-y:auto;
    overflow-x:hidden;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }

  .thumbs::-webkit-scrollbar{
    width:6px;
  }

  .thumbs::-webkit-scrollbar-track{
    background:rgba(255,255,255,0.02);
    border-radius:3px;
  }

  .thumbs::-webkit-scrollbar-thumb{
    background:rgba(56,189,248,0.3);
    border-radius:3px;
  }

  .thumb-row{
    display:flex;
    gap:10px;
    align-items:center;
    padding:8px;
    border-radius:8px;
    cursor:pointer;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border:1px solid transparent;
    animation: slideInLeft 0.4s ease-out backwards;
    animation-delay: calc(var(--index) * 0.05s);
  }

  .thumb-row:hover{
    background:rgba(255,255,255,0.03);
    border-color:rgba(56,189,248,0.2);
    transform: translateX(5px);
  }

  .thumb-row.active{
    background:rgba(56,189,248,0.08);
    border-color:var(--accent);
    animation: glow 2s ease-in-out infinite;
  }

  .thumb{
    width:80px;
    height:56px;
    border-radius:6px;
    object-fit:cover;
    box-shadow: 0 4px 14px rgba(2,6,23,0.7);
    border:2px solid transparent;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink:0;
  }

  .thumb-row:hover .thumb{
    transform:scale(1.08) rotate(2deg);
    box-shadow: 0 8px 20px rgba(56,189,248,0.3);
  }

  .thumb-row.active .thumb{
    border-color:var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }

  .meta{
    font-size:12px;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow:hidden;
    flex:1;
  }

  .meta .name{
    font-weight:600;
    color:#dff7ff;
    white-space:nowrap;
    text-overflow:ellipsis;
    overflow:hidden;
    font-size:13px;
    font-family:'Inter', sans-serif;
    letter-spacing:0.3px;
  }

  .meta .type{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    font-weight:500;
    letter-spacing:0.5px;
  }

  .stage-wrap{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:10px;
    animation: slideInRight 0.6s ease-out;
    overflow-y:auto;
    overflow-x:hidden;
    max-height:100%;
  }

  .stage-wrap::-webkit-scrollbar{
    width:8px;
  }

  .stage-wrap::-webkit-scrollbar-track{
    background:rgba(255,255,255,0.02);
    border-radius:4px;
  }

  .stage-wrap::-webkit-scrollbar-thumb{
    background:rgba(56,189,248,0.3);
    border-radius:4px;
  }

  .stage-wrap::-webkit-scrollbar-thumb:hover{
    background:rgba(56,189,248,0.5);
  }

  .stage{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    overflow:hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.03);
    box-shadow: 0 10px 60px rgba(2,6,23,0.6);
    min-height:400px;
    animation: scaleIn 0.6s ease-out 0.2s both;
  }

  .stage::before{
    content:"";
    position:absolute;
    inset: -30px;
    border-radius:20px;
    pointer-events:none;
    background: radial-gradient(closest-side, var(--ring), transparent 60%);
    filter: blur(18px);
    opacity:0.9;
    transition:opacity .5s ease;
    animation: pulse 3s ease-in-out infinite;
  }

  .stage.has-image::before{
    opacity:1;
  }

  .stage-inner{
    position:relative;
    width:92%;
    height:92%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage img{
    max-width:100%;
    max-height:100%;
    border-radius:10px;
    box-shadow: 0 12px 80px rgba(2,6,23,0.6);
    transform-origin:center center;
    transition: transform .4s cubic-bezier(0.4, 0, 0.2, 1), filter .25s ease;
    background:linear-gradient(180deg,#0c2331,#06121a);
    object-fit:contain;
    user-select:none;
    animation: scaleIn 0.5s ease-out;
  }

  .stage img:hover{
    filter: brightness(1.05);
  }

  .stage .placeholder{
    color:var(--muted);
    font-size:18px;
    text-align:center;
    padding:40px;
  }

  .stage-controls{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
  }

  .left-controls{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }

  .small{
    background:transparent;
    color:var(--muted);
    border:1px solid rgba(255,255,255,0.03);
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-family:'Inter', sans-serif;
    font-weight:500;
  }

  .small:hover{
    background:rgba(255,255,255,0.03);
    color:var(--accent);
    border-color:rgba(56,189,248,0.3);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(56,189,248,0.2);
  }

  .small:active{
    transform: translateY(0);
  }

  .progress{
    display:flex;
    gap:8px;
    align-items:center;
  }

  .range{
    width:160px;
  }

  .thumb-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
    gap:10px;
    padding:10px;
    max-height:200px;
    overflow:auto;
    margin-top:6px;
    background:rgba(255,255,255,0.01);
    border-radius:8px;
  }

  .thumb-grid::-webkit-scrollbar{
    height:6px;
  }

  .thumb-grid::-webkit-scrollbar-track{
    background:rgba(255,255,255,0.02);
  }

  .thumb-grid::-webkit-scrollbar-thumb{
    background:rgba(56,189,248,0.3);
    border-radius:3px;
  }

  .grid-item{
    background: rgba(255,255,255,0.02);
    border-radius:8px;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:2px solid transparent;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    animation: scaleIn 0.4s ease-out backwards;
    animation-delay: calc(var(--grid-index) * 0.03s);
  }

  .grid-item:hover{
    background:rgba(255,255,255,0.04);
    border-color:rgba(56,189,248,0.3);
    transform:translateY(-4px) scale(1.02);
    box-shadow: 0 8px 20px rgba(56,189,248,0.2);
  }

  .grid-item.active{
    border-color:var(--accent);
    background:rgba(56,189,248,0.08);
    animation: glow 2s ease-in-out infinite;
  }

  .grid-item img{
    width:100%;
    height:80px;
    object-fit:cover;
    border-radius:6px;
  }

  .grid-item .caption{
    font-size:11px;
    color:var(--muted);
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:100%;
  }

  .file-counter{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    padding:8px;
    background:rgba(255,255,255,0.02);
    border-radius:6px;
    margin-top:4px;
  }

  .pagination{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px;
    background:rgba(255,255,255,0.02);
    border-radius:8px;
    margin-top:8px;
    animation: fadeIn 0.5s ease-out 0.4s both;
  }

  .pagination-btn{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    color:var(--muted);
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-family:'Inter', sans-serif;
    font-weight:500;
    min-width:36px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .pagination-btn:hover:not(:disabled){
    background:rgba(56,189,248,0.1);
    border-color:var(--accent);
    color:var(--accent);
    transform:translateY(-2px);
  }

  .pagination-btn:disabled{
    opacity:0.3;
    cursor:not-allowed;
  }

  .pagination-btn.active{
    background:var(--accent);
    color:#071025;
    border-color:var(--accent);
    font-weight:600;
  }

  .pagination-info{
    font-size:12px;
    color:var(--muted);
    padding:0 8px;
    font-family:'Inter', sans-serif;
  }

  .btn{
    background:var(--glass);
    border:1px solid rgba(255,255,255,0.04);
    color:var(--accent);
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    display:inline-flex;
    gap:6px;
    align-items:center;
    transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-family:'Inter', sans-serif;
    font-weight:500;
  }

  .btn:hover{
    background:rgba(56,189,248,0.1);
    border-color:var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(56,189,248,0.3);
  }

  .btn:active{
    transform: translateY(0);
  }

  @media (max-width:900px){
    .app{ 
      grid-template-columns: 1fr; 
      grid-template-rows: 1fr auto;
      padding:12px; 
      gap:12px;
      overflow-y:auto;
      height:auto;
      min-height:100vh;
    }
    .panel{ 
      order:2; 
      max-height:280px;
    }
    .stage-wrap{ 
      order:1; 
      min-height:auto;
      max-height:none;
      overflow:visible;
    }
    .stage{
      min-height:300px;
    }
    .thumb-grid{
      max-height:120px;
    }
    .stage-controls{
      flex-direction:column;
      align-items:stretch;
    }
    .left-controls{
      flex-wrap:wrap;
      justify-content:center;
    }
  }

  @media (max-width:800px){
    body{
      overflow-y: auto;
      overflow-x: hidden;
    }
    
    .app{
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      height:auto;
      min-height:100vh;
      overflow:visible;
    }
    
    /* Hide the entire left panel */
    .panel{
      display:none !important;
    }
    
    .stage-wrap{
      order:1;
      display:flex !important;
    }
    
    .stage{
      min-height:calc(100vh - 40px);
    }
  }

  @media (max-width:600px){
    .app{
      padding:8px;
      gap:8px;
    }
    .panel{
      max-height:none;
      padding:10px;
      min-height:calc(100vh - 16px);
    }
    .panel h2{
      font-size:16px;
    }
    .thumb-row{
      padding:8px;
    }
    .thumb{
      width:80px;
      height:56px;
    }
    .meta .name{
      font-size:12px;
    }
    .meta .type{
      font-size:10px;
    }
    .small, .btn{
      padding:6px 10px;
      font-size:12px;
    }
    .range{
      width:100px;
    }
    .thumb-grid{
      grid-template-columns: repeat(auto-fill,minmax(80px,1fr));
      max-height:100px;
      gap:6px;
    }
    .grid-item img{
      height:60px;
    }
    #fileName{
      font-size:12px;
    }
    #fileInfo{
      font-size:10px;
    }
    .file-counter{
      font-size:12px;
      padding:8px;
    }
    .pagination{
      padding:10px;
      gap:8px;
    }
    .pagination-btn{
      padding:6px 10px;
      font-size:12px;
    }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="panel" aria-label="Certificates panel">
    <h2>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:8px; animation: pulse 2s ease-in-out infinite;">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      My Certificates
    </h2>

    <div class="controls" role="toolbar" aria-label="toolbar">
      <div class="search" title="Search certificates">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input id="search" type="search" placeholder="Search..." aria-label="search certificates">
      </div>
    </div>

    <div class="file-counter" id="fileCounter">
      Loading certificates...
    </div>

    <div class="pagination" id="pagination">
      <button class="pagination-btn" id="paginationFirst" title="First page">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="11 17 6 12 11 7"></polyline>
          <polyline points="18 17 13 12 18 7"></polyline>
        </svg>
      </button>
      <button class="pagination-btn" id="paginationPrev" title="Previous page">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <span class="pagination-info" id="paginationInfo">1 / 1</span>
      <button class="pagination-btn" id="paginationNext" title="Next page">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <button class="pagination-btn" id="paginationLast" title="Last page">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
      </button>
    </div>

    <div class="thumbs" id="thumbs" aria-live="polite" aria-atomic="false">
    </div>

    <div style="display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap;">
      <button id="toggleGrid" class="small" title="Toggle thumbnail grid">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        Grid View
      </button>
      <button id="slideshowToggle" class="small" title="Start/stop slideshow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Slideshow
      </button>
    </div>
  </aside>

  <main class="stage-wrap">
    <div class="stage" id="stage" aria-label="certificate stage">
      <div class="stage-inner">
        <div class="placeholder">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:20px; animation: scaleIn 1s ease-in-out infinite alternate;">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <div>Select a certificate to view</div>
        </div>
        <img id="stageImg" src="" alt="" draggable="false" style="display:none;">
      </div>
    </div>

    <div class="stage-controls">
      <div class="left-controls">
        <button id="prev" class="small" title="Previous (←)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Prev
        </button>
        <button id="next" class="small" title="Next (→)">
          Next
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:4px;">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <div class="progress">
          <label style="font-size:12px; color:var(--muted)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:4px;">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              <line x1="11" y1="8" x2="11" y2="14"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
            Zoom
          </label>
          <input id="zoom" class="range" type="range" min="0.2" max="2.5" step="0.05" value="1" />
        </div>

        <button id="rotateLeft" class="small" title="Rotate -90°">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          Rotate
        </button>
        <button id="rotateRight" class="small" title="Rotate +90°">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Rotate
        </button>
        <button id="fitBtn" class="small" title="Reset view">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          Reset
        </button>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <div style="text-align:right; font-size:13px; color:var(--muted)">
          <div id="fileName" style="color:#dff7ff; font-weight:500;">No file selected</div>
          <div id="fileInfo" style="font-size:11px; color:var(--muted)"></div>
        </div>

        <button id="fullscreen" class="btn" title="Fullscreen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="thumb-grid" id="grid" aria-label="thumbnails grid"></div>
  </main>
</div>

<script>
const thumbs = document.getElementById('thumbs');
const grid = document.getElementById('grid');
const stageImg = document.getElementById('stageImg');
const stage = document.getElementById('stage');
const placeholder = document.querySelector('.placeholder');
const fileNameLabel = document.getElementById('fileName');
const fileInfo = document.getElementById('fileInfo');
const fileCounter = document.getElementById('fileCounter');
const search = document.getElementById('search');

const paginationInfo = document.getElementById('paginationInfo');
const paginationFirst = document.getElementById('paginationFirst');
const paginationPrev = document.getElementById('paginationPrev');
const paginationNext = document.getElementById('paginationNext');
const paginationLast = document.getElementById('paginationLast');

let items = [];
let filteredItems = [];
let current = -1;
let rotation = 0;
let zoom = 1;
let slideshowTimer = null;
let gridMode = true;

let currentPage = 1;
let itemsPerPage = 10;
let totalPages = 1;

const certificateList = [
  'Advanced Testing Practices Using AWS DevOps Tools.png',
  'AWS Cloud Practitioner Essentials Certification.png',
  'AWS Command Line Interface (CLI) Basics.png',
  'AWS Educate Introduction to Cloud 101.png',
  'Cloud Computing Foundation.png',
  'Cloud Essentials Knowledge Badge Assessment.png',
  'CodeRally 6.0 Competitive Programming Hackathon.png',
  'CodeRally5.0 hackathon, hosted by IEEE Computer Society Student Branch Chapter of IIT.png',
  'DevOps Engineer Learning Plan.png',
  'devops foundation.png',
  'DevOps Foundations Incident Management_PMI.png',
  'DevOps Foundations-Continuous Delivery and Continuous Integration.png',
  'Docker Basics for DevOps certificate.png',
  'Getting into the Serverless Mindset.png',
  'Getting Started with DevOps on AWS.png',
  'Introduction to Git.png',
  'Introduction to Observability.png',
  'Jenkins.png',
  'KodeKloud Docker course certificate.png',
  'KodeKloud Engineer certificate.png',
  'Meta and Coursera course certificate.png',
  'Microsoft Learn Student Ambassador.png',
  'OCI Certification.png',
  'Shell Scripting Beginners.png',
  'Skill Up 3.0.png',
  'TechXplore 1.0.png'
];

function uid() { return Math.random().toString(36).slice(2,9) }

function updateCounter(){
  const visible = filteredItems.length;
  
  if(items.length === 0){
    fileCounter.textContent = 'No certificates loaded';
  } else if(visible === items.length){
    fileCounter.textContent = `${items.length} certificate${items.length !== 1 ? 's' : ''}`;
  } else {
    fileCounter.textContent = `${visible} of ${items.length} certificate${items.length !== 1 ? 's' : ''}`;
  }
}

function updatePagination(){
  totalPages = Math.ceil(filteredItems.length / itemsPerPage);
  if(totalPages === 0) totalPages = 1;
  
  paginationInfo.textContent = `${currentPage} / ${totalPages}`;
  
  paginationFirst.disabled = currentPage === 1;
  paginationPrev.disabled = currentPage === 1;
  paginationNext.disabled = currentPage === totalPages;
  paginationLast.disabled = currentPage === totalPages;
}

function renderPage(){
  thumbs.innerHTML = '';
  
  if(filteredItems.length === 0){
    thumbs.innerHTML = '<div style="color:var(--muted); padding:20px; text-align:center;">No certificates found</div>';
    return;
  }
  
  const startIndex = (currentPage - 1) * itemsPerPage;
  const endIndex = Math.min(startIndex + itemsPerPage, filteredItems.length);
  const pageItems = filteredItems.slice(startIndex, endIndex);
  
  pageItems.forEach((item, index) => {
    const row = document.createElement('div');
    row.className = 'thumb-row';
    row.dataset.id = item.id;
    row.style.setProperty('--index', index);

    const img = document.createElement('img');
    img.loading = 'lazy';
    img.className = 'thumb';
    img.src = item.url;
    img.alt = item.name;

    row.addEventListener('click', () => {
      const globalIndex = items.findIndex(x=>x.id===item.id);
      showIndex(globalIndex);
    });

    const meta = document.createElement('div');
    meta.className = 'meta';
    
    const nm = document.createElement('div');
    nm.className = 'name';
    nm.textContent = item.name;
    nm.title = item.name;
    
    const typeLabel = document.createElement('div');
    typeLabel.className = 'type';
    typeLabel.textContent = 'Certificate';
    
    meta.appendChild(nm);
    meta.appendChild(typeLabel);

    row.appendChild(img);
    row.appendChild(meta);
    thumbs.appendChild(row);
  });
  
  updateActiveThumb();
}

function goToPage(page){
  currentPage = Math.max(1, Math.min(page, totalPages));
  renderPage();
  updatePagination();
}

function loadCertificates(){
  certificateList.forEach(filename => {
    const id = uid();
    const item = { 
      id, 
      name: filename, 
      url: './portfolioSetificat/' + filename, 
      type: 'image/png' 
    };
    items.push(item);
    renderGridItem(item);
  });
  
  filteredItems = [...items];
  updateCounter();
  updatePagination();
  renderPage();
  
  if(items.length > 0) {
    showIndex(0);
  }
}

paginationFirst.addEventListener('click', () => goToPage(1));
paginationPrev.addEventListener('click', () => goToPage(currentPage - 1));
paginationNext.addEventListener('click', () => goToPage(currentPage + 1));
paginationLast.addEventListener('click', () => goToPage(totalPages));

function renderGridItem(item){
  const box = document.createElement('div');
  box.className = 'grid-item';
  box.dataset.id = item.id;
  box.style.setProperty('--grid-index', items.length - 1);
  
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.src = item.url;
  img.alt = item.name;

  const caption = document.createElement('div');
  caption.className = 'caption';
  caption.textContent = item.name;
  caption.title = item.name;

  box.appendChild(img);
  box.appendChild(caption);
  
  box.addEventListener('click', () => {
    const index = items.findIndex(x=>x.id===item.id);
    showIndex(index);
    scrollThumbIntoView(item.id);
  });

  grid.appendChild(box);
}

function showIndex(index){
  if(index < 0 || index >= items.length) return;
  current = index;
  const it = items[index];
  
  placeholder.style.display = 'none';
  stageImg.style.display = 'block';
  stageImg.src = it.url;
  stageImg.style.transform = `scale(${zoom}) rotate(${rotation}deg)`;
  stageImg.alt = it.name;
  stage.classList.add('has-image');
  
  fileNameLabel.textContent = it.name;
  fileInfo.textContent = 'Certificate';
  
  updateActiveThumb();
  updateActiveGrid();
  scrollThumbIntoView(it.id);
  
  const stageWrap = document.querySelector('.stage-wrap');
  if(stageWrap){
    stageWrap.scrollTo({ top: 0, behavior: 'smooth' });
  }
  
  if(window.innerWidth <= 900){
    setTimeout(() => {
      stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function updateActiveThumb(){
  document.querySelectorAll('.thumb-row').forEach(t => t.classList.remove('active'));
  const it = items[current];
  if(!it) return;
  const row = thumbs.querySelector(`[data-id="${it.id}"]`);
  if(row) row.classList.add('active');
}

function updateActiveGrid(){
  document.querySelectorAll('.grid-item').forEach(g => {
    g.classList.remove('active');
  });
  
  if(current >= 0 && items[current]){
    const id = items[current].id;
    const el = grid.querySelector(`[data-id="${id}"]`);
    if(el) el.classList.add('active');
  }
}

function scrollThumbIntoView(id){
  const row = thumbs.querySelector(`[data-id="${id}"]`);
  if(row) row.scrollIntoView({behavior:'smooth', block:'center'});
}

document.getElementById('next').addEventListener('click', () => {
  if(items.length === 0) return;
  showIndex((current + 1) % items.length);
});

document.getElementById('prev').addEventListener('click', () => {
  if(items.length === 0) return;
  showIndex((current - 1 + items.length) % items.length);
});

document.getElementById('toggleGrid').addEventListener('click', () => {
  gridMode = !gridMode;
  grid.style.display = gridMode ? 'grid' : 'none';
  document.getElementById('toggleGrid').textContent = gridMode ? 'Hide Grid' : 'Grid View';
});

const zoomControl = document.getElementById('zoom');
zoomControl.addEventListener('input', (e) => {
  zoom = parseFloat(e.target.value);
  updateTransform();
});

document.getElementById('rotateLeft').addEventListener('click', () => { 
  rotation -= 90; 
  updateTransform(); 
});

document.getElementById('rotateRight').addEventListener('click', () => { 
  rotation += 90; 
  updateTransform(); 
});

document.getElementById('fitBtn').addEventListener('click', () => { 
  zoom = 1; 
  rotation = 0; 
  zoomControl.value = 1; 
  updateTransform(); 
});

function updateTransform(){
  if(stageImg.style.display !== 'none'){
    stageImg.style.transform = `scale(${zoom}) rotate(${rotation}deg)`;
  }
}

document.getElementById('fullscreen').addEventListener('click', async () => {
  const s = document.documentElement;
  if(!document.fullscreenElement){
    await s.requestFullscreen?.();
  } else {
    await document.exitFullscreen?.();
  }
});

document.getElementById('slideshowToggle').addEventListener('click', () => toggleSlideshow());

function toggleSlideshow(){
  if(slideshowTimer){
    clearInterval(slideshowTimer);
    slideshowTimer = null;
    document.getElementById('slideshowToggle').innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      Slideshow`;
  } else {
    if(items.length === 0){
      alert('No certificates to show');
      return;
    }
    slideshowTimer = setInterval(() => {
      if(items.length === 0) return;
      showIndex((current + 1) % items.length);
    }, 3000);
    document.getElementById('slideshowToggle').innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
      Stop`;
  }
}

window.addEventListener('keydown', (e) => {
  if(e.target.tagName === 'INPUT') return;
  
  if(e.key === 'ArrowRight') document.getElementById('next').click();
  if(e.key === 'ArrowLeft') document.getElementById('prev').click();
  if(e.key === '+' || e.key === '=') { 
    zoom = Math.min(2.5, zoom + 0.1); 
    zoomControl.value = zoom; 
    updateTransform(); 
  }
  if(e.key === '-' || e.key === '_') { 
    zoom = Math.max(0.2, zoom - 0.1); 
    zoomControl.value = zoom; 
    updateTransform(); 
  }
  if(e.key === ' ') { 
    e.preventDefault(); 
    toggleSlideshow(); 
  }
  if(e.key === 'f' || e.key === 'F'){
    document.getElementById('fullscreen').click();
  }
  if(e.key === 'r' || e.key === 'R'){
    document.getElementById('fitBtn').click();
  }
}); 

search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  
  if(q === ''){
    filteredItems = [...items];
  } else {
    filteredItems = items.filter(it => it.name.toLowerCase().includes(q));
  }
  
  currentPage = 1;
  
  grid.querySelectorAll('.grid-item').forEach(g => {
    const id = g.dataset.id;
    const it = items.find(x=>x.id===id);
    if(it){
      g.style.display = filteredItems.includes(it) ? 'flex' : 'none';
    }
  });
  
  updateCounter();
  updatePagination();
  renderPage();
});

window.addEventListener('DOMContentLoaded', () => {
  loadCertificates();
});
</script>
</body>
</html>
