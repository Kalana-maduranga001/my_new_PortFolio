<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Portfolio - Projects Carousel</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;600;700&family=Bebas+Neue&family=Poppins:wght@300;400;600;700&family=Raleway:wght@300;400;600;700&family=Cinzel:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", sans-serif;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.7) 100%),
                radial-gradient(circle at center, rgba(0, 245, 201, 0.08) 0%, transparent 40%),
                radial-gradient(circle at top left, rgba(255, 0, 200, 0.04), transparent 60%),
                radial-gradient(circle at bottom right, rgba(0, 245, 201, 0.04), transparent 60%),
                linear-gradient(135deg, #050510 0%, #0a0f1a 50%, #050a15 100%);
            color: #00d9ff;
            overflow-x: hidden;
            cursor: none;
            position: relative;
            min-height: 100vh;
        }

        * {
            cursor: none;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(26, 58, 82, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Projects Section */
        .projects-section {
            min-height: 100vh;
            padding: 120px 40px 80px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .section-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .section-title {
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 10px;
            margin-bottom: 20px;
            font-family: "Bebas Neue", cursive;
            background: linear-gradient(135deg, #00d9ff 0%, #ffffff 50%, #00d9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 217, 255, 0.3);
        }

        .section-subtitle {
            font-size: 18px;
            color: rgba(0, 217, 255, 0.8);
            font-family: "Montserrat", sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Elliptical Carousel Container */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 700px;
            margin: 0 auto;
            perspective: 2000px;
        }

        .carousel-ellipse {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* Project Card */
        .project-card {
            position: absolute;
            width: 450px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            left: 50%;
            top: 50%;
            transform-origin: center center;
        }

        .project-card.active {
            border-color: rgba(0, 217, 255, 0.5);
            box-shadow: 0 20px 60px rgba(0, 217, 255, 0.4);
            z-index: 100;
        }

        .project-number {
            font-size: 100px;
            font-weight: 900;
            font-family: "Bebas Neue", cursive;
            color: rgba(0, 217, 255, 0.1);
            position: absolute;
            top: -15px;
            right: 15px;
            line-height: 1;
            z-index: 0;
        }

        .project-content {
            position: relative;
            z-index: 1;
        }

        .project-image-container {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            aspect-ratio: 16/10;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.2);
            margin-bottom: 20px;
        }

        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            filter: grayscale(0.5);
        }

        .project-card.active .project-image {
            filter: grayscale(0);
            transform: scale(1.05);
        }

        .project-label {
            font-size: 12px;
            color: #ff006e;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: "Montserrat", sans-serif;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .project-title {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 12px;
            font-family: "Bebas Neue", cursive;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .project-description {
            font-size: 14px;
            color: rgba(0, 217, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 15px;
            font-family: "Poppins", sans-serif;
        }

        .project-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .meta-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .meta-label {
            font-size: 11px;
            color: #ff006e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 100px;
            font-family: "Montserrat", sans-serif;
        }

        .meta-value {
            font-size: 12px;
            color: rgba(0, 217, 255, 0.9);
            font-family: "Poppins", sans-serif;
        }

        /* Navigation Buttons */
        .carousel-nav {
            position: absolute;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 200;
        }

        .nav-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 217, 255, 0.1);
            border: 2px solid #00d9ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(0, 217, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: all 0.6s;
            border-radius: 50%;
        }

        .nav-btn:hover::before {
            width: 100px;
            height: 100px;
        }

        .nav-btn:hover {
            background: rgba(0, 217, 255, 0.2);
            border-color: #ff006e;
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.4);
        }

        .nav-arrow {
            width: 20px;
            height: 20px;
            border-top: 3px solid #00d9ff;
            border-right: 3px solid #00d9ff;
            transition: all 0.3s;
        }

        .nav-btn:hover .nav-arrow {
            border-color: #ff006e;
        }

        .nav-btn.prev .nav-arrow {
            transform: rotate(-135deg);
        }

        .nav-btn.next .nav-arrow {
            transform: rotate(45deg);
        }

        /* Progress Indicator */
        .progress-indicator {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 200;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(0, 217, 255, 0.2);
            border: 2px solid rgba(0, 217, 255, 0.4);
            transition: all 0.4s;
        }

        .progress-dot.active {
            background: #00d9ff;
            border-color: #ff006e;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.8);
            transform: scale(1.3);
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid #00d9ff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: all 0.15s ease;
            transform: translate(-50%, -50%);
        }

        .cursor-follower {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #ff006e;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: all 0.1s ease;
            transform: translate(-50%, -50%);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .section-title {
                font-size: 60px;
            }

            .carousel-container {
                height: 600px;
            }

            .project-card {
                width: 380px;
                padding: 25px;
            }

            .project-title {
                font-size: 24px;
            }
        }

        @media (max-width: 768px) {
            .projects-section {
                padding: 100px 20px 120px;
            }

            .section-title {
                font-size: 48px;
                letter-spacing: 5px;
            }

            .section-subtitle {
                font-size: 14px;
            }

            .carousel-container {
                height: 550px;
            }

            .project-card {
                width: 320px;
                padding: 20px;
            }

            .project-number {
                font-size: 70px;
            }

            .project-title {
                font-size: 22px;
            }

            .project-description {
                font-size: 13px;
            }

            .nav-btn {
                width: 50px;
                height: 50px;
            }

            .carousel-nav {
                bottom: -100px;
            }

            .progress-indicator {
                bottom: -120px;
            }
        }

        @media (max-width: 480px) {
            .section-title {
                font-size: 36px;
            }

            .carousel-container {
                height: 500px;
            }

            .project-card {
                width: 280px;
                padding: 18px;
            }

            .project-title {
                font-size: 20px;
            }

            .project-number {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="custom-cursor"></div>
    <div class="cursor-follower"></div>

    <section class="projects-section" id="projects">
        <div class="section-header">
            <h2 class="section-title">PROJECTS</h2>
            <p class="section-subtitle">Architecture & Design Portfolio</p>
        </div>

        <div class="carousel-container">
            <div class="carousel-ellipse" id="carousel">
                <!-- Project Cards will be generated by JavaScript -->
            </div>
            
            <div class="carousel-nav">
                <button class="nav-btn prev" id="prevBtn">
                    <div class="nav-arrow"></div>
                </button>
                <button class="nav-btn next" id="nextBtn">
                    <div class="nav-arrow"></div>
                </button>
            </div>

            <div class="progress-indicator" id="progressIndicator">
                <!-- Progress dots will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <script>
        // Project Data
        const projects = [
            {
                number: "01",
                label: "Residential",
                title: "Modern Villa Design",
                description: "A contemporary residential masterpiece featuring clean lines and sustainable materials.",
                image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800",
                client: "Jane Doe",
                size: "3000-4000 sq ft",
                location: "Beverly Hills"
            },
            {
                number: "02",
                label: "Commercial",
                title: "Urban Office Complex",
                description: "Innovative workspace design promoting collaboration and creativity in the city center.",
                image: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=800",
                client: "Tech Corp",
                size: "50,000 sq ft",
                location: "Downtown"
            },
            {
                number: "03",
                label: "Interior Design",
                title: "Luxury Penthouse",
                description: "Sophisticated interior spaces combining elegance and cutting-edge design elements.",
                image: "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=800",
                client: "Private Client",
                size: "5,000 sq ft",
                location: "Skyline Tower"
            },
            {
                number: "04",
                label: "Sustainable",
                title: "Eco-Friendly Residence",
                description: "Green architecture featuring solar panels and natural ventilation systems.",
                image: "https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=800",
                client: "Green Living Inc.",
                size: "4,500 sq ft",
                location: "Suburban Area"
            },
            {
                number: "05",
                label: "Renovation",
                title: "Historic Building",
                description: "Breathing new life into a century-old structure while preserving its heritage.",
                image: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=800",
                client: "Heritage Foundation",
                size: "8,000 sq ft",
                location: "Historic District"
            },
            {
                number: "06",
                label: "Hospitality",
                title: "Boutique Hotel",
                description: "A unique hotel experience blending luxury comfort with contemporary aesthetics.",
                image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800",
                client: "Luxury Hotels Group",
                size: "25,000 sq ft",
                location: "Beach Front"
            },
            {
                number: "07",
                label: "Cultural",
                title: "Art Gallery Space",
                description: "Minimalist design creating the perfect backdrop for contemporary art exhibitions.",
                image: "https://images.unsplash.com/photo-1600210491892-03d54c0aaf87?w=800",
                client: "Modern Art Museum",
                size: "15,000 sq ft",
                location: "Arts District"
            },
            {
                number: "08",
                label: "Educational",
                title: "Innovation Center",
                description: "State-of-the-art learning facility designed to inspire creativity and discovery.",
                image: "https://images.unsplash.com/photo-1562774053-701939374585?w=800",
                client: "Tech University",
                size: "40,000 sq ft",
                location: "Campus East"
            },
            {
                number: "09",
                label: "Retail",
                title: "Fashion Flagship Store",
                description: "Bold retail space merging brand identity with immersive shopping experience.",
                image: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800",
                client: "Fashion Brand",
                size: "10,000 sq ft",
                location: "Shopping District"
            },
            {
                number: "10",
                label: "Wellness",
                title: "Spa & Wellness Center",
                description: "Tranquil sanctuary designed for relaxation, rejuvenation, and holistic wellness.",
                image: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=800",
                client: "Wellness Group",
                size: "12,000 sq ft",
                location: "Resort Area"
            },
            {
                number: "11",
                label: "Mixed-Use",
                title: "Urban Living Complex",
                description: "Integrated development combining residential, retail, and community spaces.",
                image: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=800",
                client: "City Developers",
                size: "100,000 sq ft",
                location: "City Center"
            },
            {
                number: "12",
                label: "Industrial",
                title: "Creative Co-Working Hub",
                description: "Converted warehouse transformed into a dynamic collaborative workspace.",
                image: "https://images.unsplash.com/photo-1497366216548-37526070297c?w=800",
                client: "Startup Collective",
                size: "20,000 sq ft",
                location: "Industrial Quarter"
            }
        ];

        // Carousel State
        let currentIndex = 0;
        let isAnimating = false;
        const totalProjects = projects.length;
        const carousel = document.getElementById('carousel');
        const progressIndicator = document.getElementById('progressIndicator');

        // Create Project Cards
        function createProjectCard(project, index) {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.innerHTML = `
                <span class="project-number">${project.number}</span>
                <div class="project-content">
                    <div class="project-image-container">
                        <img src="${project.image}" alt="${project.title}" class="project-image">
                    </div>
                    <div class="project-label">${project.label}</div>
                    <h3 class="project-title">${project.title}</h3>
                    <p class="project-description">${project.description}</p>
                    <div class="project-meta">
                        <div class="meta-item">
                            <span class="meta-label">Client:</span>
                            <span class="meta-value">${project.client}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Size:</span>
                            <span class="meta-value">${project.size}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Location:</span>
                            <span class="meta-value">${project.location}</span>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        // Create Progress Dots
        function createProgressDots() {
            for (let i = 0; i < totalProjects; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                if (i === 0) dot.classList.add('active');
                progressIndicator.appendChild(dot);
            }
        }

        // Position cards in ellipse
        function positionCards() {
            const cards = carousel.querySelectorAll('.project-card');
            const radiusX = 600; // Horizontal radius
            const radiusY = 250; // Vertical radius
            
            cards.forEach((card, index) => {
                const angle = ((index - currentIndex) * (2 * Math.PI / totalProjects));
                const x = Math.cos(angle) * radiusX;
                const z = Math.sin(angle) * radiusY;
                
                // Calculate scale and opacity based on Z position
                const scale = 0.6 + (z + radiusY) / (radiusY * 2) * 0.4;
                const opacity = 0.3 + (z + radiusY) / (radiusY * 2) * 0.7;
                
                // Determine if this is the active card (front center)
                const isActive = Math.abs(angle) < 0.1;
                
                card.style.transform = `
                    translate(-50%, -50%)
                    translate3d(${x}px, 0, ${z}px)
                    scale(${scale})
                `;
                card.style.opacity = opacity;
                card.style.zIndex = Math.round(z + radiusY);
                
                if (isActive) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
        }

        // Update progress indicator
        function updateProgress() {
            const dots = progressIndicator.querySelectorAll('.progress-dot');
            dots.forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        // Navigate carousel
        function navigate(direction) {
            if (isAnimating) return;
            isAnimating = true;

            if (direction === 'next') {
                currentIndex = (currentIndex + 1) % totalProjects;
            } else {
                currentIndex = (currentIndex - 1 + totalProjects) % totalProjects;
            }

            positionCards();
            updateProgress();

            setTimeout(() => {
                isAnimating = false;
            }, 600);
        }

        // Initialize carousel
        function initCarousel() {
            // Create cards
            projects.forEach((project, index) => {
                const card = createProjectCard(project, index);
                carousel.appendChild(card);
            });

            // Create progress dots
            createProgressDots();

            // Position cards
            positionCards();

            // Event listeners
            document.getElementById('prevBtn').addEventListener('click', () => navigate('prev'));
            document.getElementById('nextBtn').addEventListener('click', () => navigate('next'));

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') navigate('prev');
                if (e.key === 'ArrowRight') navigate('next');
            });

            // Auto-rotate (optional)
            let autoRotate = setInterval(() => navigate('next'), 5000);

            // Pause on hover
            carousel.addEventListener('mouseenter', () => clearInterval(autoRotate));
            carousel.addEventListener('mouseleave', () => {
                autoRotate = setInterval(() => navigate('next'), 5000);
            });
        }

        // Custom cursor
        const cursor = document.querySelector('.custom-cursor');
        const cursorFollower = document.querySelector('.cursor-follower');

        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.15;
            cursorY += (mouseY - cursorY) * 0.15;

            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
            cursorFollower.style.left = cursorX + 'px';
            cursorFollower.style.top = cursorY + 'px';

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Cursor hover effects
        document.querySelectorAll('button, .project-card').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.width = '40px';
                cursor.style.height = '40px';
                cursor.style.borderColor = '#ff006e';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.width = '20px';
                cursor.style.height = '20px';
                cursor.style.borderColor = '#00d9ff';
            });
        });

        // Initialize on load
        initCarousel();
    </script>
</body>
</html>
