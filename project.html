<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Portfolio - Projects Carousel</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;600;700&family=Bebas+Neue&family=Poppins:wght@300;400;600;700&family=Raleway:wght@300;400;600;700&family=Cinzel:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", sans-serif;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.7) 100%),
                radial-gradient(circle at center, rgba(0, 245, 201, 0.08) 0%, transparent 40%),
                radial-gradient(circle at top left, rgba(255, 0, 200, 0.04), transparent 60%),
                radial-gradient(circle at bottom right, rgba(0, 245, 201, 0.04), transparent 60%),
                linear-gradient(135deg, #050510 0%, #0a0f1a 50%, #050a15 100%);
            color: #00d9ff;
            overflow-x: hidden;
            cursor: none;
            position: relative;
            min-height: 100vh;
        }

        * {
            cursor: none;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(26, 58, 82, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .projects-section {
            min-height: 100vh;
            padding: 120px 40px 150px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .section-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .section-title {
            font-size: 80px;
            font-weight: 900;
            letter-spacing: 10px;
            margin-bottom: 20px;
            font-family: "Bebas Neue", cursive;
            background: linear-gradient(135deg, #00d9ff 0%, #ffffff 50%, #00d9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 217, 255, 0.3);
        }

        .section-subtitle {
            font-size: 18px;
            color: rgba(0, 217, 255, 0.8);
            font-family: "Montserrat", sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 750px;
            margin: 0 auto;
            perspective: 2500px;
        }

        .carousel-ellipse {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .project-card {
            position: absolute;
            width: 420px;
            background: rgba(10, 15, 30, 0.25);
            border: 2px solid rgba(0, 217, 255, 0.25);
            border-radius: 16px;
            padding: 0;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            left: 50%;
            top: 50%;
            transform-origin: center center;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            pointer-events: all;
        }

        .project-card:hover:not(.active) {
            border-color: rgba(0, 217, 255, 0.4);
            background: rgba(10, 15, 30, 0.35);
            transform: translate(-50%, -50%) translate3d(var(--x), 0, var(--z)) scale(var(--hover-scale)) !important;
        }

        .project-card.active {
            border-color: rgba(0, 217, 255, 0.9) !important;
            background: rgba(10, 15, 30, 0.85) !important;
            box-shadow: 0 30px 100px rgba(0, 217, 255, 0.6),
                        0 0 80px rgba(255, 0, 110, 0.4),
                        inset 0 0 30px rgba(0, 217, 255, 0.1) !important;
            z-index: 1000 !important;
            pointer-events: all;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
        }

        .project-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.08), rgba(255, 0, 110, 0.08));
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .project-card.active::before {
            opacity: 1;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.15), rgba(255, 0, 110, 0.15));
        }

        .project-number {
            font-size: 120px;
            font-weight: 900;
            font-family: "Bebas Neue", cursive;
            color: rgba(0, 217, 255, 0.08);
            position: absolute;
            top: -20px;
            right: 20px;
            line-height: 1;
            z-index: 0;
            transition: all 0.4s;
        }

        .project-card.active .project-number {
            color: rgba(0, 217, 255, 0.15);
        }

        .project-content {
            position: relative;
            z-index: 1;
        }

        .project-image-container {
            position: relative;
            overflow: hidden;
            border-radius: 16px 16px 0 0;
            aspect-ratio: 16/9;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid rgba(0, 217, 255, 0.2);
        }

        .project-image-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(to top, rgba(10, 15, 30, 0.9), transparent);
            z-index: 1;
        }

        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: grayscale(0.6) brightness(0.7);
        }

        .project-card.active .project-image {
            filter: grayscale(0) brightness(1);
            transform: scale(1.08);
        }

        .project-info {
            padding: 25px;
        }

        .project-label {
            font-size: 11px;
            color: #ff006e;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-family: "Montserrat", sans-serif;
            font-weight: 700;
            margin-bottom: 12px;
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 0, 110, 0.1);
            border-radius: 4px;
            border: 1px solid rgba(255, 0, 110, 0.3);
        }

        .project-title {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 14px;
            font-family: "Bebas Neue", cursive;
            letter-spacing: 2px;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0, 217, 255, 0.3);
        }

        .project-description {
            font-size: 13px;
            color: rgba(0, 217, 255, 0.8);
            line-height: 1.7;
            margin-bottom: 20px;
            font-family: "Poppins", sans-serif;
            min-height: 65px;
        }

        .project-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 217, 255, 0.15);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-label {
            font-size: 10px;
            color: #ff006e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: "Montserrat", sans-serif;
        }

        .meta-value {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-family: "Poppins", sans-serif;
            font-weight: 500;
        }

        .carousel-nav {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            z-index: 200;
        }

        .nav-btn {
            width: 65px;
            height: 65px;
            background: rgba(0, 217, 255, 0.08);
            border: 2px solid #00d9ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-btn::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(0, 217, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: all 0.6s;
            border-radius: 50%;
        }

        .nav-btn:hover::before {
            width: 120px;
            height: 120px;
        }

        .nav-btn:hover {
            background: rgba(0, 217, 255, 0.15);
            border-color: #ff006e;
            transform: scale(1.15);
            box-shadow: 0 10px 40px rgba(0, 217, 255, 0.5);
        }

        .nav-arrow {
            width: 22px;
            height: 22px;
            border-top: 3px solid #00d9ff;
            border-right: 3px solid #00d9ff;
            transition: all 0.3s;
        }

        .nav-btn:hover .nav-arrow {
            border-color: #ff006e;
        }

        .nav-btn.prev .nav-arrow {
            transform: rotate(-135deg);
        }

        .nav-btn.next .nav-arrow {
            transform: rotate(45deg);
        }

        .progress-indicator {
            position: absolute;
            bottom: -130px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 200;
        }

        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(0, 217, 255, 0.2);
            border: 2px solid rgba(0, 217, 255, 0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-dot:hover {
            transform: scale(1.3);
            background: rgba(0, 217, 255, 0.4);
            border-color: rgba(0, 217, 255, 0.6);
        }

        .progress-dot.active {
            background: #00d9ff;
            border-color: #ff006e;
            box-shadow: 0 0 25px rgba(0, 217, 255, 1);
            transform: scale(1.5);
        }

        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid #00d9ff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: all 0.15s ease;
            transform: translate(-50%, -50%);
        }

        .cursor-follower {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #ff006e;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: all 0.1s ease;
            transform: translate(-50%, -50%);
        }

        @media (max-width: 1024px) {
            .section-title {
                font-size: 60px;
                letter-spacing: 8px;
            }

            .section-subtitle {
                font-size: 16px;
            }

            .carousel-container {
                height: 650px;
                max-width: 1200px;
            }

            .project-card {
                width: 360px;
            }

            .project-title {
                font-size: 24px;
            }

            .project-description {
                font-size: 12px;
                min-height: 60px;
            }

            .project-number {
                font-size: 100px;
            }
        }

        @media (max-width: 768px) {
            body {
                cursor: auto;
            }

            * {
                cursor: auto;
            }

            .custom-cursor,
            .cursor-follower {
                display: none;
            }

            .projects-section {
                padding: 80px 20px 180px;
            }

            .section-header {
                margin-bottom: 60px;
            }

            .section-title {
                font-size: 48px;
                letter-spacing: 5px;
            }

            .section-subtitle {
                font-size: 14px;
                letter-spacing: 1.5px;
            }

            .carousel-container {
                height: 550px;
                padding: 0 10px;
            }

            .project-card {
                width: 300px;
            }

            .project-number {
                font-size: 80px;
                top: -15px;
                right: 15px;
            }

            .project-title {
                font-size: 22px;
            }

            .project-description {
                font-size: 11px;
                min-height: 50px;
                margin-bottom: 15px;
            }

            .project-info {
                padding: 20px;
            }

            .project-label {
                font-size: 10px;
                padding: 3px 10px;
            }

            .project-meta {
                grid-template-columns: 1fr;
                gap: 10px;
                padding-top: 12px;
            }

            .meta-label {
                font-size: 9px;
            }

            .meta-value {
                font-size: 11px;
            }

            .nav-btn {
                width: 55px;
                height: 55px;
            }

            .nav-arrow {
                width: 18px;
                height: 18px;
                border-width: 2.5px;
            }

            .carousel-nav {
                bottom: -110px;
                gap: 20px;
            }

            .progress-indicator {
                bottom: -145px;
                gap: 10px;
            }

            .progress-dot {
                width: 9px;
                height: 9px;
            }
        }

        @media (max-width: 480px) {
            .projects-section {
                padding: 60px 15px 200px;
            }

            .section-header {
                margin-bottom: 50px;
            }

            .section-title {
                font-size: 36px;
                letter-spacing: 3px;
            }

            .section-subtitle {
                font-size: 12px;
                letter-spacing: 1px;
            }

            .carousel-container {
                height: 500px;
            }

            .project-card {
                width: 260px;
            }

            .project-number {
                font-size: 60px;
                top: -10px;
                right: 10px;
            }

            .project-title {
                font-size: 20px;
                letter-spacing: 1px;
            }

            .project-description {
                font-size: 10px;
                line-height: 1.6;
                min-height: 45px;
                margin-bottom: 12px;
            }

            .project-info {
                padding: 18px;
            }

            .project-label {
                font-size: 9px;
                letter-spacing: 2px;
                padding: 3px 8px;
                margin-bottom: 10px;
            }

            .project-meta {
                gap: 8px;
                padding-top: 10px;
            }

            .meta-label {
                font-size: 8px;
                letter-spacing: 1px;
            }

            .meta-value {
                font-size: 10px;
            }

            .nav-btn {
                width: 50px;
                height: 50px;
            }

            .nav-arrow {
                width: 16px;
                height: 16px;
                border-width: 2px;
            }

            .carousel-nav {
                bottom: -120px;
                gap: 15px;
            }

            .progress-indicator {
                bottom: -155px;
                gap: 8px;
            }

            .progress-dot {
                width: 8px;
                height: 8px;
                border-width: 1.5px;
            }
        }

        @media (max-width: 375px) {
            .section-title {
                font-size: 32px;
            }

            .carousel-container {
                height: 480px;
            }

            .project-card {
                width: 240px;
            }

            .project-title {
                font-size: 18px;
            }

            .project-number {
                font-size: 50px;
            }

            .project-info {
                padding: 15px;
            }

            .nav-btn {
                width: 45px;
                height: 45px;
            }

            .nav-arrow {
                width: 14px;
                height: 14px;
            }
        }

        @media (max-width: 320px) {
            .section-title {
                font-size: 28px;
                letter-spacing: 2px;
            }

            .section-subtitle {
                font-size: 11px;
            }

            .carousel-container {
                height: 450px;
            }

            .project-card {
                width: 220px;
            }

            .project-title {
                font-size: 17px;
            }

            .project-description {
                font-size: 9px;
                min-height: 40px;
            }

            .project-number {
                font-size: 45px;
            }

            .nav-btn {
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="custom-cursor"></div>
    <div class="cursor-follower"></div>

    <section class="projects-section" id="projects">
        <div class="section-header">
            <h2 class="section-title">PROJECTS</h2>
            <p class="section-subtitle">Architecture & Design Portfolio</p>
        </div>

        <div class="carousel-container">
            <div class="carousel-ellipse" id="carousel"></div>
            
            <div class="carousel-nav">
                <button class="nav-btn prev" id="prevBtn">
                    <div class="nav-arrow"></div>
                </button>
                <button class="nav-btn next" id="nextBtn">
                    <div class="nav-arrow"></div>
                </button>
            </div>

            <div class="progress-indicator" id="progressIndicator"></div>
        </div>
    </section>

    <script>
        const projects = [
            {
                number: "01",
                label: "Residential",
                title: "Modern Villa Design",
                description: "A contemporary residential masterpiece featuring clean lines and sustainable materials.",
                image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800",
                client: "Jane Doe",
                size: "3000-4000 sq ft",
                location: "Beverly Hills"
            },
            {
                number: "02",
                label: "Commercial",
                title: "Urban Office Complex",
                description: "Innovative workspace design promoting collaboration and creativity in the city center.",
                image: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=800",
                client: "Tech Corp",
                size: "50,000 sq ft",
                location: "Downtown"
            },
            {
                number: "03",
                label: "Interior Design",
                title: "Luxury Penthouse",
                description: "Sophisticated interior spaces combining elegance and cutting-edge design elements.",
                image: "https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=800",
                client: "Private Client",
                size: "5,000 sq ft",
                location: "Skyline Tower"
            },
            {
                number: "04",
                label: "Sustainable",
                title: "Eco-Friendly Residence",
                description: "Green architecture featuring solar panels and natural ventilation systems.",
                image: "https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=800",
                client: "Green Living Inc.",
                size: "4,500 sq ft",
                location: "Suburban Area"
            },
            {
                number: "05",
                label: "Renovation",
                title: "Historic Building",
                description: "Breathing new life into a century-old structure while preserving its heritage.",
                image: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=800",
                client: "Heritage Foundation",
                size: "8,000 sq ft",
                location: "Historic District"
            },
            {
                number: "06",
                label: "Hospitality",
                title: "Boutique Hotel",
                description: "A unique hotel experience blending luxury comfort with contemporary aesthetics.",
                image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800",
                client: "Luxury Hotels Group",
                size: "25,000 sq ft",
                location: "Beach Front"
            },
            {
                number: "07",
                label: "Cultural",
                title: "Art Gallery Space",
                description: "Minimalist design creating the perfect backdrop for contemporary art exhibitions.",
                image: "https://images.unsplash.com/photo-1600210491892-03d54c0aaf87?w=800",
                client: "Modern Art Museum",
                size: "15,000 sq ft",
                location: "Arts District"
            },
            {
                number: "08",
                label: "Educational",
                title: "Innovation Center",
                description: "State-of-the-art learning facility designed to inspire creativity and discovery.",
                image: "https://images.unsplash.com/photo-1562774053-701939374585?w=800",
                client: "Tech University",
                size: "40,000 sq ft",
                location: "Campus East"
            },
            {
                number: "09",
                label: "Retail",
                title: "Fashion Flagship Store",
                description: "Bold retail space merging brand identity with immersive shopping experience.",
                image: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800",
                client: "Fashion Brand",
                size: "10,000 sq ft",
                location: "Shopping District"
            },
            {
                number: "10",
                label: "Wellness",
                title: "Spa & Wellness Center",
                description: "Tranquil sanctuary designed for relaxation, rejuvenation, and holistic wellness.",
                image: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=800",
                client: "Wellness Group",
                size: "12,000 sq ft",
                location: "Resort Area"
            },
            {
                number: "11",
                label: "Mixed-Use",
                title: "Urban Living Complex",
                description: "Integrated development combining residential, retail, and community spaces.",
                image: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=800",
                client: "City Developers",
                size: "100,000 sq ft",
                location: "City Center"
            },
            {
                number: "12",
                label: "Industrial",
                title: "Creative Co-Working Hub",
                description: "Converted warehouse transformed into a dynamic collaborative workspace.",
                image: "https://images.unsplash.com/photo-1497366216548-37526070297c?w=800",
                client: "Startup Collective",
                size: "20,000 sq ft",
                location: "Industrial Quarter"
            }
        ];

        let currentIndex = 0;
        let isAnimating = false;
        const totalProjects = projects.length;
        const carousel = document.getElementById('carousel');
        const progressIndicator = document.getElementById('progressIndicator');

        function createProjectCard(project, index) {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.dataset.index = index;
            card.innerHTML = `
                <span class="project-number">${project.number}</span>
                <div class="project-content">
                    <div class="project-image-container">
                        <img src="${project.image}" alt="${project.title}" class="project-image">
                    </div>
                    <div class="project-info">
                        <div class="project-label">${project.label}</div>
                        <h3 class="project-title">${project.title}</h3>
                        <p class="project-description">${project.description}</p>
                        <div class="project-meta">
                            <div class="meta-item">
                                <span class="meta-label">Client</span>
                                <span class="meta-value">${project.client}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Size</span>
                                <span class="meta-value">${project.size}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Location</span>
                                <span class="meta-value">${project.location}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            card.addEventListener('click', function(e) {
                e.stopPropagation();
                const clickedIndex = parseInt(this.dataset.index);
                if (clickedIndex !== currentIndex) {
                    navigateToIndex(clickedIndex);
                }
            });

            return card;
        }

        function navigateToIndex(targetIndex) {
            if (isAnimating || targetIndex === currentIndex) return;
            
            isAnimating = true;
            currentIndex = targetIndex;
            positionCards();
            updateProgress();

            setTimeout(() => {
                isAnimating = false;
            }, 700);
        }

        function createProgressDots() {
            for (let i = 0; i < totalProjects; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                dot.dataset.index = i;
                if (i === 0) dot.classList.add('active');
                
                dot.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const dotIndex = parseInt(this.dataset.index);
                    navigateToIndex(dotIndex);
                });
                
                progressIndicator.appendChild(dot);
            }
        }

        function positionCards() {
            const cards = carousel.querySelectorAll('.project-card');
            const screenWidth = window.innerWidth;
            
            // Adjust ellipse size based on screen size
            let radiusX = 700;
            let radiusY = 280;
            
            if (screenWidth <= 320) {
                radiusX = 300;
                radiusY = 120;
            } else if (screenWidth <= 375) {
                radiusX = 350;
                radiusY = 140;
            } else if (screenWidth <= 480) {
                radiusX = 400;
                radiusY = 160;
            } else if (screenWidth <= 768) {
                radiusX = 500;
                radiusY = 200;
            } else if (screenWidth <= 1024) {
                radiusX = 600;
                radiusY = 240;
            }
            
            cards.forEach((card, index) => {
                let relativeIndex = index - currentIndex;
                
                if (relativeIndex > totalProjects / 2) {
                    relativeIndex -= totalProjects;
                } else if (relativeIndex < -totalProjects / 2) {
                    relativeIndex += totalProjects;
                }
                
                const angle = relativeIndex * (2 * Math.PI / totalProjects);
                const x = Math.cos(angle) * radiusX;
                const z = Math.sin(angle) * radiusY;
                
                const normalizedZ = (z + radiusY) / (radiusY * 2);
                const scale = 0.5 + normalizedZ * 0.5;
                const hoverScale = scale * 1.08;
                const opacity = 0.08 + normalizedZ * 0.25;
                
                const isActive = index === currentIndex;
                
                card.style.setProperty('--x', `${x}px`);
                card.style.setProperty('--z', `${z}px`);
                card.style.setProperty('--hover-scale', hoverScale);
                
                // Adjust active card positioning for mobile
                let activeZ = 400;
                let activeY = -30;
                let activeScale = 1.25;
                
                if (screenWidth <= 480) {
                    activeZ = 250;
                    activeY = -20;
                    activeScale = 1.15;
                } else if (screenWidth <= 768) {
                    activeZ = 300;
                    activeY = -25;
                    activeScale = 1.2;
                }
                
                if (isActive) {
                    card.style.transform = `translate(-50%, -50%) translate3d(0px, ${activeY}px, ${activeZ}px) scale(${activeScale})`;
                    card.style.opacity = 1;
                    card.style.zIndex = 9999;
                    card.classList.add('active');
                } else {
                    card.style.transform = `translate(-50%, -50%) translate3d(${x}px, 0, ${z}px) scale(${scale})`;
                    card.style.opacity = opacity;
                    card.style.zIndex = Math.round(z + radiusY);
                    card.classList.remove('active');
                }
            });
        }

        function updateProgress() {
            const dots = progressIndicator.querySelectorAll('.progress-dot');
            dots.forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function navigate(direction) {
            if (isAnimating) return;
            isAnimating = true;

            if (direction === 'next') {
                currentIndex = (currentIndex + 1) % totalProjects;
            } else {
                currentIndex = (currentIndex - 1 + totalProjects) % totalProjects;
            }

            positionCards();
            updateProgress();

            setTimeout(() => {
                isAnimating = false;
            }, 700);
        }

        function initCarousel() {
            projects.forEach((project, index) => {
                const card = createProjectCard(project, index);
                carousel.appendChild(card);
            });

            createProgressDots();
            positionCards();

            document.getElementById('prevBtn').addEventListener('click', () => navigate('prev'));
            document.getElementById('nextBtn').addEventListener('click', () => navigate('next'));

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') navigate('prev');
                if (e.key === 'ArrowRight') navigate('next');
            });

            let autoRotate = setInterval(() => navigate('next'), 5000);

            carousel.addEventListener('mouseenter', () => clearInterval(autoRotate));
            carousel.addEventListener('mouseleave', () => {
                autoRotate = setInterval(() => navigate('next'), 5000);
            });
            
            // Reposition on window resize
            window.addEventListener('resize', () => {
                positionCards();
            });
        }

        const cursor = document.querySelector('.custom-cursor');
        const cursorFollower = document.querySelector('.cursor-follower');

        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.15;
            cursorY += (mouseY - cursorY) * 0.15;

            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
            cursorFollower.style.left = cursorX + 'px';
            cursorFollower.style.top = cursorY + 'px';

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        document.querySelectorAll('button, .project-card, .progress-dot').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.width = '40px';
                cursor.style.height = '40px';
                cursor.style.borderColor = '#ff006e';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.width = '20px';
                cursor.style.height = '20px';
                cursor.style.borderColor = '#00d9ff';
            });
        });

        initCarousel();
    </script>
</body>
</html>
